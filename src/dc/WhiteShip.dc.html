<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>White ship at sea</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;family=Mrs+Saint+Delafield&amp;family=Gloock&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ws-cam{animation:ws-cam 28s ease-in-out infinite alternate}
.ws-far{animation:ws-par 28s ease-in-out infinite alternate;--d:10px}
.ws-mid{animation:ws-par 28s ease-in-out infinite alternate;--d:26px}
.ws-near{animation:ws-par 28s ease-in-out infinite alternate;--d:54px}
.ws-boat{animation:ws-bob 6.5s ease-in-out infinite;transform-origin:50% 90%}
.ws-sail{animation:ws-sail 80s ease-in-out infinite alternate}
.ws-refl{animation:ws-refl 6.5s ease-in-out infinite;transform-origin:50% 50%}
.ws-halo{animation:ws-pulse 6s ease-in-out infinite}
.ws-cloud{animation:ws-drift 46s ease-in-out infinite alternate}
.ws-fog{animation:ws-fog linear infinite}
.ws-wave{animation:ws-wave linear infinite}
.ws-ray{animation:ws-ray 9s ease-in-out infinite;transform-origin:100% 0}
.ws-spark{animation:ws-rise ease-in-out infinite,ws-tw ease-in-out infinite}
.ws-glint{animation:ws-tw ease-in-out infinite}
.ws-gull{animation:ws-fly 30s linear infinite}
.ws-gull2{animation:ws-fly 38s -14s linear infinite}
.ws-flap{animation:ws-flap 1s ease-in-out infinite;transform-origin:50% 50%}
@keyframes ws-cam{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.06) translateY(-8px)}}
@keyframes ws-par{from{transform:translateX(calc(var(--d) * -1))}to{transform:translateX(var(--d))}}
@keyframes ws-bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes ws-refl{0%,100%{transform:scaleY(-1) translateY(0) rotate(1deg);opacity:.32}50%{transform:scaleY(-1) translateY(4px) rotate(-1deg);opacity:.22}}
@keyframes ws-sail{from{transform:translateX(-5vw)}to{transform:translateX(5vw)}}
@keyframes ws-pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes ws-drift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes ws-fog{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ws-wave{from{background-position-x:0}to{background-position-x:-480px}}
@keyframes ws-ray{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes ws-rise{0%{transform:translateY(0)}50%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@keyframes ws-tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes ws-fly{0%{transform:translate(-10vw,0)}50%{transform:translate(50vw,-3vh)}100%{transform:translate(115vw,1vh)}}
@keyframes ws-flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.ws-credit{animation:ws-credit-in 2.4s .8s cubic-bezier(.2,.7,.2,1) both,ws-credit-float 7s 3.2s ease-in-out infinite}
.ws-credit-tw{animation:ws-tw 2.4s ease-in-out infinite}
.ws-credit-tw2{animation-delay:-1.1s}
@keyframes ws-credit-in{from{opacity:0;filter:blur(8px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ws-credit-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (max-width:720px){.ws-credit p:first-of-type{font-size:26px !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</helmet>
