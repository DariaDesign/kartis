<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kartis — Shabbat Shalom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&amp;family=Geist:wght@400;500;600&amp;family=Gloock&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600&amp;family=Mrs+Saint+Delafield&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.78}
.k-fl{position:absolute;left:50%;bottom:100%;margin-bottom:5px;width:18px;height:28px;margin-left:-9px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:#FFA93A;transform-origin:50% 95%;animation:k-flick 1.8s ease-in-out infinite}
.k-fl::after{content:"";position:absolute;left:50%;bottom:3px;width:8px;height:13px;margin-left:-4px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;background:#FFE680}
.k-fl.k-big{width:30px;height:46px;margin-left:-15px;margin-bottom:8px}
.k-fl.k-big::after{width:14px;height:22px;margin-left:-7px;bottom:5px}
.k-wk{position:absolute;left:50%;bottom:100%;width:2px;height:7px;margin-left:-1px;background:#3A2A1C;border-radius:1px}
.k-d2{animation-duration:2.3s;animation-delay:-.7s}
.k-pulse{animation:k-glow 2.8s ease-in-out infinite}
.k-pulse2{animation:k-glow 2.3s -1s ease-in-out infinite}
.k-sway{transform-origin:50% 100%;animation:k-sway 4.5s ease-in-out infinite}
.k-sway2{transform-origin:50% 100%;animation:k-sway 3.8s -1.2s ease-in-out infinite}
.k-bob{animation:k-bob 2.6s ease-in-out infinite}
.k-bob2{animation:k-bob 2.2s -.9s ease-in-out infinite}
.k-tw{animation:k-tw 2.2s ease-in-out infinite}
.k-tw2{animation:k-tw 2.9s -1.1s ease-in-out infinite}
.k-tw3{animation:k-tw 2.5s -.4s ease-in-out infinite}
.k-st1{animation:k-in .9s .4s both,k-tw 2.6s 1.3s ease-in-out infinite}
.k-st2{animation:k-in .9s 1.4s both,k-tw 3s 2.3s ease-in-out infinite}
.k-st3{animation:k-in .9s 2.4s both,k-tw 2.4s 3.3s ease-in-out infinite}
.k-rise{animation:k-rise 1.2s cubic-bezier(.2,.7,.2,1) both}
.k-rise2{animation:k-rise 1.2s .2s cubic-bezier(.2,.7,.2,1) both}
.k-rise3{animation:k-rise 1.2s .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes k-flick{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.94,1.07) rotate(3deg)}45%{transform:scale(1.05,.95) rotate(-3deg)}70%{transform:scale(.97,1.05) rotate(2deg)}}
@keyframes k-glow{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes k-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes k-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes k-tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
@keyframes k-in{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes k-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
@media (max-width:720px){.k-scene{transform:scale(.72);transform-origin:bottom center;margin-top:-90px}}
</style>
</helmet>
<div style="min-height: 100vh; background: {{sc.bg}}; color: {{sc.ink}}; font-family: {{t.body}}; transition: background .5s, color .5s; display: flex; flex-direction: column; overflow: hidden">



<header style="max-width: 1174px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 28px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="font-family: Gloock, serif; font-size: 26px; font-weight: 400; letter-spacing: -0.01em">Kartis</span><span style="display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0px 14px; border-radius: 999px; border: 1px solid rgba(46, 33, 22, 0.14); font-size: 13px; color: rgb(107, 84, 64)">Resting for Shabbat</span></header>

<main style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px 64px; text-align: center">

<sc-if value="{{isGolden}}" hint-placeholder-val="{{ true }}">

<div style="position: absolute; left: -30px; right: -30px; bottom: 30px; height: 2px; background: repeating-linear-gradient(90deg, #E8B9A4 0 10px, transparent 10px 18px); opacity: .7"></div>
<div style="position: absolute; left: 44px; bottom: 66px; display: flex; flex-direction: column; align-items: center">
<div style="position: relative; width: 70px; height: 70px">
<div class="k-sway" style="position: absolute; left: 22px; bottom: 0; width: 2px; height: 66px; background: #6E8B5A"><div style="position: absolute; left: -9px; top: -9px; width: 20px; height: 20px; border-radius: 50%; background: #F29E8E"></div></div>
<div class="k-sway2" style="position: absolute; left: 36px; bottom: 0; width: 2px; height: 54px; background: #6E8B5A"><div style="position: absolute; left: -8px; top: -8px; width: 18px; height: 18px; border-radius: 50%; background: #F7C873"></div></div>
<div class="k-sway" style="position: absolute; left: 48px; bottom: 0; width: 2px; height: 44px; background: #6E8B5A"><div style="position: absolute; left: -7px; top: -7px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px #EBD3B6"></div></div>
</div>
<div style="width: 44px; height: 46px; margin-top: -2px; border-radius: 8px 8px 14px 14px; background: rgba(170,205,200,.55); box-shadow: inset 0 0 0 1px rgba(80,120,115,.25)"></div>
</div>
<div style="position: absolute; left: 142px; bottom: 66px; display: flex; flex-direction: column; align-items: center">
<div class="k-pulse" style="position: absolute; left: 50%; top: -70px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,90,.45), rgba(255,190,90,0) 65%)"></div>
<div style="position: relative; width: 22px; height: 150px; border-radius: 5px 5px 2px 2px; background: #E99A85"><div class="k-wk"></div><div class="k-fl"></div></div>
<div style="width: 40px; height: 14px; border-radius: 4px 4px 10px 10px; background: #D6AE6B"></div>
<div style="width: 62px; height: 10px; border-radius: 50%; background: #C49A55"></div>
</div>
<div style="position: absolute; left: 280px; bottom: 66px; width: 150px; height: 66px">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-radius: 50%; background: #C9853D"></div>
<div style="position: absolute; left: 6px; bottom: 10px; width: 46px; height: 42px; border-radius: 50%; background: #D9984C; box-shadow: inset 6px -6px 0 rgba(255,255,255,.18)"></div>
<div style="position: absolute; left: 38px; bottom: 16px; width: 46px; height: 46px; border-radius: 50%; background: #DFA155; box-shadow: inset 6px -6px 0 rgba(255,255,255,.2)"></div>
<div style="position: absolute; left: 70px; bottom: 16px; width: 46px; height: 46px; border-radius: 50%; background: #D9984C; box-shadow: inset 6px -6px 0 rgba(255,255,255,.18)"></div>
<div style="position: absolute; left: 100px; bottom: 10px; width: 44px; height: 40px; border-radius: 50%; background: #DFA155; box-shadow: inset 6px -6px 0 rgba(255,255,255,.2)"></div>
<div style="position: absolute; left: 52px; top: 12px; width: 3px; height: 5px; border-radius: 50%; background: #FFF6E0"></div>
<div style="position: absolute; left: 84px; top: 10px; width: 3px; height: 5px; border-radius: 50%; background: #FFF6E0"></div>
<div style="position: absolute; left: 66px; top: 20px; width: 3px; height: 5px; border-radius: 50%; background: #FFF6E0"></div>
</div>
<div style="position: absolute; left: 193px; bottom: 66px; display: flex; flex-direction: column; align-items: center">
<div class="k-pulse2" style="position: absolute; left: 50%; top: -70px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,90,.45), rgba(255,190,90,0) 65%)"></div>
<div style="position: relative; width: 22px; height: 138px; border-radius: 5px 5px 2px 2px; background: #F2CF6E"><div class="k-wk"></div><div class="k-fl k-d2"></div></div>
<div style="width: 40px; height: 14px; border-radius: 4px 4px 10px 10px; background: #D6AE6B"></div>
<div style="width: 62px; height: 10px; border-radius: 50%; background: #C49A55"></div>
</div>

<div style="position: absolute; left: 452px; bottom: 60px; width: 76px; height: 132px">
<svg viewBox="0 0 76 132" width="76" height="132" role="img" aria-label="A silver Havdalah cup on a silver plate" style="display: block; overflow: visible">
<ellipse cx="38" cy="126" rx="37" ry="6" fill="#B9BEC7"></ellipse>
<ellipse cx="38" cy="124.5" rx="31" ry="4" fill="#D3D7DE"></ellipse>

<path d="M22 122 C22 114 32 112 34 104 L42 104 C44 112 54 114 54 122 Z" fill="#C2C7CF"></path>
<rect x="34.5" y="74" width="7" height="31" rx="2" fill="#C2C7CF"></rect>
<ellipse cx="38" cy="84" rx="7.5" ry="4.5" fill="#B3B9C2"></ellipse>
<path d="M14 10 L62 10 C62 44 54 64 38 74 C22 64 14 44 14 10 Z" fill="#CDD1D8"></path>
<path d="M14 10 L24 10 C24 40 28 58 38 74 C22 64 14 44 14 10 Z" fill="#E4E7EC"></path>
<rect x="14.6" y="23" width="46.8" height="8" fill="#B3B9C2"></rect>
<g fill="#E9ECF0"><circle cx="20" cy="27" r="1.2"></circle><circle cx="26" cy="27" r="1.2"></circle><circle cx="32" cy="27" r="1.2"></circle><circle cx="38" cy="27" r="1.2"></circle><circle cx="44" cy="27" r="1.2"></circle><circle cx="50" cy="27" r="1.2"></circle><circle cx="56" cy="27" r="1.2"></circle></g>
<ellipse cx="38" cy="10" rx="24" ry="4.2" fill="#B3B9C2"></ellipse>
<ellipse cx="38" cy="10.6" rx="21.5" ry="3.2" fill="#9A2F45"></ellipse>

<rect x="28" y="40" width="3" height="5" rx="1.5" fill="#FFFFFF" opacity=".9"></rect>
</svg>
<div class="k-tw" aria-hidden="true" style="position: absolute; left: 20px; top: 34px; width: 7px; height: 7px; background: #FFFFFF; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%)"></div>
</div></div>
</sc-if>

<h1 class="k-rise" style="margin: 44px 0 0; font-family: {{t.script}}; font-style: {{t.scriptStyle}}; font-weight: 400; font-size: {{t.scriptSize}}; line-height: 1.05; color: {{sc.ink}}">Shabbat Shalom</h1>
<p class="k-rise2" style="margin: 16px auto 0; max-width: 520px; font-size: 18px; line-height: 1.6; color: {{sc.muted}}">{{sc.copy}}</p>
<div class="k-rise3" style="margin-top: 32px; display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 10px 16px; padding: 16px 24px; border-radius: 999px; background: {{sc.surface}}; border: 1px solid {{sc.line}}">
<span style="font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: {{sc.muted}}">{{sc.timeLabel}}</span>
<span style="font-family: {{t.display}}; font-weight: {{t.headWeight}}; letter-spacing: {{t.headTrack}}; font-size: 22px">[HAVDALAH TIME] · [CITY]</span>
</div>
<p class="k-rise3" style="margin: 24px 0 0; font-size: 14px; color: {{sc.muted}}">Already have your cards? Enjoy the table.</p>
</main>

<footer style="max-width: 1174px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 24px 16px 32px; border-top: 1px solid {{sc.line}}; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: {{sc.muted}}">
<span>Printed cards for a phone-free Shabbat.</span>
<a href="Main.dc.html" style="text-decoration: none">Why we close on Shabbat</a>
</footer>
<dc-import name="MusicPill" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
const SM_SCENES = {
  golden: { label: 'Golden table', bg: '#F7E6CF', ink: '#2E2116', muted: '#6B5440', line: 'rgba(46,33,22,0.14)', surface: '#FBF1E2', accent: '#D9663F', accentInk: '#FFF8EE',
    copy: 'The table is set and the candles are lit. Kartis rests until Havdalah. Your drafts are safe, and editing opens again once Shabbat is out.', timeLabel: 'See you after Havdalah' }
};
const SM_SCENE_ORDER = ['golden'];
const SM_TYPE = {
  paper: { label: 'Gloock', display: "'Gloock', serif", body: "'Instrument Sans', sans-serif", script: "'Mrs Saint Delafield', cursive", scriptStyle: 'normal', scriptSize: 'clamp(72px, 9vw, 116px)', headWeight: '400', headTrack: '-0.01em' },
};
const SM_ORDER = ['paper'];
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sceneKey = 'golden';
    const sc = SM_SCENES[sceneKey] || SM_SCENES.golden;
    const key = s.theme || this.props.theme || 'paper';
    const t = SM_TYPE[key] || SM_TYPE.paper;
    const pill = (on) => ({ bg: on ? sc.accent : 'transparent', fg: on ? sc.accentInk : sc.ink });
    return {
      sc, t,
      scenes: SM_SCENE_ORDER.map((k) => ({ label: SM_SCENES[k].label, pressed: k === sceneKey, ...pill(k === sceneKey), pick: () => this.setState({ scene: k }) })),
      themes: SM_ORDER.map((k) => ({ label: SM_TYPE[k].label, pressed: k === key, ...pill(k === key), pick: () => this.setState({ theme: k }) })),
      isGolden: true
    };
  }
}
</script>
</body>
</html>
